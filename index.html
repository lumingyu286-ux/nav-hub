<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>成人内容百科 - 入口</title>
<meta name="description" content="成人内容百科的入口页，列出各栏目入口与当前可用的访问地址。内容面向 18 周岁及以上成年人。">

<!-- ↓ 镜像站取消这一行注释，主力站保持注释。详见 README.md
     只开 noindex,follow。别再加指向主站的 canonical：
     两个信号矛盾，canonical 会把 noindex 一并传给主站。 -->
<!-- <meta name="robots" content="noindex,follow"> -->

<meta property="og:type" content="website">
<meta property="og:locale" content="zh_CN">
<meta property="og:title" content="成人内容百科 - 入口">
<meta property="og:description" content="各栏目入口与访问地址，面向 18 周岁及以上成年人。">
<meta name="referrer" content="no-referrer-when-downgrade">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="gate" class="gate" role="dialog" aria-modal="true" aria-labelledby="gate-title" hidden>
  <div class="gate-panel">
    <p class="gate-mark">18+</p>
    <h2 id="gate-title">年龄确认</h2>
    <p class="gate-body">本站内容面向成年人。继续前，请确认你已满 18 周岁。</p>
    <div class="gate-actions">
      <button type="button" id="gate-ok" class="btn">我已满 18 周岁</button>
      <button type="button" id="gate-no" class="btn btn-quiet">离开</button>
    </div>
    <p class="gate-fine">确认结果只存在你这台设备的浏览器里。</p>
  </div>
</div>

<noscript>
  <div class="shell">
    <h1 class="title">成人内容百科</h1>
    <p class="lede">本页需要 JavaScript 才能显示入口列表。你也可以直接访问
      <a href="https://chengrenbaike.com/">chengrenbaike.com</a>（内容仅限年满 18 周岁者访问）。</p>
  </div>
</noscript>

<!-- 脚本没起来时的兜底。app.js 一启动就会把它藏掉。
     noscript 只在「禁用了 JS」时出现，管不了「JS 开着但 app.js 被拦截」，
     而后者才是更常见的情况 —— 不兜住的话页面就是一片空白。 -->
<div class="boot">
  <p class="mark-wrap"><span class="mark">18+</span></p>
  <h2>页面没能加载完整</h2>
  <p>刷新一下通常就好。如果反复这样，可能是拦截插件挡掉了本页的脚本。</p>
</div>

<!-- hidden 由 app.js 在年龄确认通过后撤掉。不能只靠遮罩盖住：
     遮罩下面的链接还在 Tab 顺序里，能被键盘绕过去。 -->
<div id="page" class="shell" hidden>

<header class="head">
  <h1 class="title" id="title">成人内容百科</h1>
  <p class="lede" id="lede"></p>
</header>

<main>
  <h2 class="sr-only">入口</h2>
  <div class="board" id="board"></div>
</main>

<footer class="foot">
  <p class="foot-age"><span class="mark">18+</span> 本站内容仅限年满 18 周岁者访问</p>
  <p class="foot-note" id="foot-note"></p>
</footer>

</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
